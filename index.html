/* доминирующий цвет постера → "h,s" */
const colorOf=u=>new Promise(r=>{
 const t=setTimeout(()=>r(''),5000),im=new Image();im.crossOrigin='anonymous';
 im.onload=()=>{clearTimeout(t);try{
  const c=document.createElement('canvas');c.width=c.height=20;const g=c.getContext('2d');g.drawImage(im,0,0,20,20);const d=g.getImageData(0,0,20,20).data;
  let X=0,Y=0,W=0,Sa=0;
  for(let i=0;i<d.length;i+=4){const R=d[i]/255,G=d[i+1]/255,B=d[i+2]/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,df=mx-mn;if(df<.08||l<.1||l>.92)continue;
   const s=df/(1-Math.abs(2*l-1));let h=mx==R?((G-B)/df)%6:mx==G?(B-R)/df+2:(R-G)/df+4;h*=60;if(h<0)h+=360;const w=s*df;
   X+=Math.cos(h*Math.PI/180)*w;Y+=Math.sin(h*Math.PI/180)*w;W+=w;Sa+=s*w}
  if(!W)return r('');let h=Math.atan2(Y,X)*180/Math.PI;if(h<0)h+=360;
  r(Math.round(h)+','+Math.round(Math.max(45,Math.min(85,Sa/W*100))));
 }catch(e){r('')}};
 im.onerror=()=>{clearTimeout(t);r('')};im.src=px(u,48);
});
const hsl=(c,a)=>{const [h,s]=c.split(',');return `hsla(${h},${s}%,48%,${a})`};
const theme=c=>{const [h,s]=c.split(',');return [`hsl(${h},${s}%,44%)`,`hsl(${h},${Math.round(s*.8)}%,16%)`]};

   const d=await tj('/tv/'+num(it.id));
   if(!d.overview){try{d.overview=(await tj('/tv/'+num(it.id),'en-US')).overview}catch(e){}}
   mix(it,ft2(d));
   const seas=(d.seasons||[]).filter(s=>s.season_number>0&&s.episode_count>0).sort((a,b)=>a.season_number-b.season_number);
   if(seas.length){it.ss=seas.map(s=>s.episode_count);it.e=it.ss.reduce((a,b)=>a+b,0)}
   it.rt=(d.episode_run_time&&d.episode_run_time[0])||(d.last_episode_to_air&&d.last_episode_to_air.runtime)||it.rt||45;
   const La=d.last_episode_to_air;
   if(La){let before=0;seas.forEach(s=>{if(s.season_number<La.season_number)before+=s.episode_count});it.a=before+La.episode_number}else it.a=0;

  }
  it.ck=Date.now();

 }catch(e){}

const epl=(x,k)=>{const p=sxe(x,k);return p?`S${p[0]} · E${p[1]}`:`Серия ${k}`};
const eps=(x,k)=>{const p=sxe(x,k);return p?`S${p[0]}·E${p[1]}`:`E${k}`};

const dayLabel=t=>{const d=new Date(t),n=new Date(),k=x=>x.toDateString(),tm=new Date(n.getTime()+864e5);return k(d)==k(n)?'Сегодня':k(d)==k(tm)?'Завтра':d.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})};

 else{if(x.s=='done'||x.s=='drop'||(x.s=='plan'&&w>0))x.s='watch';if(s0=='done')x.dn=0}

 return {done:x.s=='done'&&s0!='done',undo:()=>{dayAdd(-(x.w-w0));x.w=w0;x.s=s0;x.dn=dn0;x.u=u0;save(x);refresh()}};
}

 },
 qadd:id=>{const x=pool[id];if(!x||items[id])return;x.s='plan';x.w=0;x.u=Date.now();save(x);info(x).then(()=>{save(x)});hap();toast('В планах: '+x.n);recs=recs.filter(r=>r.id!=id);renderSR()},
 start:id=>{const x=items[id];if(!x)return;x.s='watch';x.u=Date.now();save(x);hap();toast('Теперь смотришь: '+x.n);draw()},
 inc:d=>{const x=items[cur&&cur.id];if(!x)return;const r=bump(x,+d);if(!r)return;hap();if(r.done)finish(x);else sheet()},
 hinc:id=>{const x=items[id];if(!x)return;const r=bump(x,1);if(!r)return;hap();draw();if(r.done)finish(x);else toast(`${epl(x,x.w)} отмечена`,r.undo)},
 rinc:id=>act.hinc(id),
 season:i=>{const x=items[cur&&cur.id];if(!x||!x.ss)return;i=+i;let a=0;for(let k=0;k<i;k++)a+=x.ss[k];const end=a+x.ss[i],target=x.w>=end?a:end,r=bump(x,target-x.w);if(!r)return;hap();if(r.done)finish(x);else{sheet();toast(`Сезон ${i+1}: ${target==end?'просмотрен':'снята отметка'}`,r.undo)}},
 set:s=>{const x=items[cur&&cur.id];if(!x)return;const was=x.s;x.s=s;x.u=Date.now();if(s=='done'){if(x.e)x.w=x.e;x.dn=Date.now()}else if(was=='done')x.dn=0;save(x);hap();if(s=='done'&&was!='done')finish(x);else sheet()},
 rate:v=>{const x=items[cur&&cur.id];if(!x)return;x.r=x.r==+v?0:+v;save(x);hap();sheet()},
 bellsheet:()=>cur&&toggleBell(cur.id),
 bell:id=>toggleBell(id),
 ex:()=>{const e=$('#dsc');e&&e.classList.toggle('open')},
 share:()=>{const x=cur;if(!x||!link(x.id))return;const l=items[x.id];shareTg(link(x.id),`${x.n}${l&&l.r?' — моя оценка '+l.r+'/10':''}`)},
 del:()=>{const x=cur;if(!x)return;delete items[x.id];dirty.delete(x.id);S.del('i_'+x.id);syncSoon();toast('Удалено: '+x.n);closeTop()},
 undo:()=>{if(uf){uf();uf=null}$('#ts').classList.remove('show');hap()},
 goal:()=>{const g=[3,5,7,10,14,21];goal=g[(g.indexOf(goal)+1)%g.length]||7;S.set('goal',String(goal));hap();draw()},
 recap:()=>{recap();hap()},
 rshare:()=>{const b=document.querySelector('[data-a=rshare]');shareTg(link('f'+U.id),b?b.dataset.t:'Мой год в Kadr')},
 shr:()=>{shr=!shr;S.set('shr',shr?'1':'');if(shr)post('/pub',{on:1,snap:snap()});else post('/pub',{on:0});hap();toast(shr?'Друзья видят твой список':'Список скрыт');draw()},
 invite:()=>{const l=link('f'+U.id);l&&shareTg(l,'Смотрим аниме и сериалы вместе? Мой список в Kadr')},
 fr:id=>openFriend(id),
 frAdd:()=>{if(!cf)return;if(!fr.includes(cf.id))fr.unshift(cf.id);fr=fr.slice(0,40);S.set('fr',fr.join(','));hap();toast('Добавлен в друзья');loadFriends();renderFriend()},
 frDel:()=>{if(!cf)return;fr=fr.filter(i=>i!=cf.id);delete fdata[cf.id];S.set('fr',fr.join(','));hap();renderFriend();if(tab=='h'||tab=='p')setTimeout(()=>draw(),0)}
};
document.addEventListener('click',e=>{const x=e.target.closest('[data-a]');if(x&&act[x.dataset.a])act[x.dataset.a](x.dataset.v)});
document.addEventListener('change',e=>{if(e.target.id=='nt'&&cur&&items[cur.id]){items[cur.id].nt=e.target.value.slice(0,280);save(items[cur.id])}});
let tmr;$('#q').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(runSearch,350)});
try{T.BackButton.onClick(closeTop)}catch(e){}

/* ============ запуск ============ */
function refreshStale(){
 const now=Date.now(),due=Object.values(items).filter(x=>(x.s=='watch'||x.s=='plan')&&(now-(x.ck||0)>3*36e5||(x.nx&&x.nx.t<now&&now-(x.ck||0)>6e5)||!x.b&&!x.c));
 Promise.all(due.map(x=>info(x).then(()=>save(x)))).then(()=>{if(due.length&&!anyO()&&(tab=='h'||tab=='s'))draw();flush()});
}
function startParam(){
 if(!SP)return;const k=SP[0],v=SP.slice(1);
 if(k=='f')openFriend(v);
 else if((k=='a'||k=='t')&&/^\d+$/.test(v)){const id=k+v;if(!items[id]&&!pool[id])pool[id]={id,n:'…',i:'',e:0,w:0};act.open(id)}
}
async function boot(){
 const all=await S.all();
 for(const k in all)if(k.startsWith('i_')){try{const o=JSON.parse(all[k]);if(o&&o.id){o.w=o.w||0;items[o.id]=o}}catch(e){}}
 (all.dc||'').split(',').filter(Boolean).forEach(p=>{const [k,n]=p.split(':');if(k&&+n>0)dc[k]=+n});
 if(!all.dc&&all.days){all.days.split(',').filter(Boolean).forEach(s=>{const d=new Date(s+'T12:00:00Z'),k=dk(d);dc[k]=(dc[k]||0)+1});saveDC();S.del('days')}
 goal=+all.goal||7;fr=(all.fr||'').split(',').filter(Boolean);shr=!!all.shr;
 hadSubs=Object.values(items).some(x=>x.bl);
 draw(1);startParam();
 refreshStale();loadRecs();loadFriends();
 if(!Object.keys(items).length)trend().then(()=>{if(tab=='h'&&!anyO())draw()});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshStale();if(!anyO())draw()}});
boot();
</script></body></html>
